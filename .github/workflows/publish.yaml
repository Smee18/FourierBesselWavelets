name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # Triggers on any tag pushed to GitHub (v0.1, v1.0, v1.3.2, etc.)

jobs:
  pypi-publish:
    name: Build and publish Python distribution
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # REQUIRED for Trusted Publishing
      contents: read
      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed so hatch-vcs gets the version right!
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install build tools
        run: python -m pip install build
        
      - name: Build wheel and sdist
        run: python -m build
        
      - name: Publish package
        # This matches tags with exactly two numbers (e.g., v1.0, v2.1) 
        # and skips three-part tags (e.g., v1.3.2) or zero-prefixed versions.
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.') && !contains(github.ref, 'v0.')
        uses: pypa/gh-action-pypi-publish@release/v1