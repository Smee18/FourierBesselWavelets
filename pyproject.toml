[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fbscatnet"
dynamic = ["version"]
description = "Fourier-Bessel wavelet scattering transforms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Marcel Venturotti", email = "mv514@bath.ac.uk"}]
keywords = ["wavelets", "scattering-transform", "fourier-bessel", "image-processing", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=11.0"]  
dev = ["pytest", "ruff", "mypy", "pre-commit", "scipy-stubs", "types-tqdm", "build"]
docs = ["sphinx", "sphinx-rtd-theme", "sphinx-autobuild"]

[project.urls]
Homepage = "https://github.com/Smee18/FourierBesselWavelets"
Repository = "https://github.com/Smee18/FourierBesselWavelets.git"
Issues = "https://github.com/Smee18/FourierBesselWavelets/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/fbscatnet"]

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["src/**/*.py", "src/**/*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "cupy.*",
    "joblib.*"
]
ignore_missing_imports = true